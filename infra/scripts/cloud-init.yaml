#cloud-config
# Runs once, when the VM is created: installs what the deploy needs. Nothing is run by hand.
package_update: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - 'echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker azureaiuser
  - curl -fsSL https://aka.ms/InstallAzureCLIDeb | bash
